<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}EnvoieCVAuto{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('accueil') }}">EnvoieCV<span>Auto</span></a>
    <nav>
      <a href="{{ url_for('accueil') }}">Accueil</a>
      <a href="{{ url_for('profil') }}">Mon CV</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
